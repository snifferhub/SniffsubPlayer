name: sniff_sub_player
description: Android 媒体嗅探字幕播放器。
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.0
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  flutter_inappwebview: ^6.1.5
  http: ^1.6.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  video_player: ^2.10.1
  volume_controller: ^3.4.4
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: false

flutter_launcher_icons:
  android: true
  image_path: assets/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/app_icon.png
