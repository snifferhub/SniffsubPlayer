# Public, user-facing notes for both platforms. No AI or source links.
[changelog]
header = "本次更新\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
{{ group | split(pat="_") | last }}

{% for commit in commits -%}
- {% if commit.breaking %}【兼容性变更】{% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}
{% endfor -%}
"""
footer = """
{% if releases | length == 0 -%}
- 本次发布包含构建和维护调整。

{% endif -%}
安装包

- Android：下载 `SniffSubPlayer-Android.apk` 安装。
- iOS：下载 `SniffSubPlayer-iOS-unsigned.ipa`，使用 AltStore Classic 等侧载工具签名安装；IPA 未包含开发者证书，不能直接安装。
- `SHA256SUMS.txt` 包含两个安装包的 SHA-256 校验值。
"""
trim = true
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"
# The workflow supplies an explicit range; unpublished tags must not split it.
ignore_tags = ".*"
include_paths = [
    "app/src/main/**",
    "app/build.gradle.kts",
    "shared/src/commonMain/**",
    "shared/src/androidMain/**",
    "shared/src/iosMain/**",
    "shared/build.gradle.kts",
    "composeApp/src/commonMain/**",
    "composeApp/src/androidMain/**",
    "composeApp/src/iosMain/**",
    "composeApp/build.gradle.kts",
    "iosApp/SniffSubPlayer/**",
    "iosApp/SniffSubPlayer.xcodeproj/project.pbxproj",
    "build.gradle.kts",
    "settings.gradle.kts",
    "gradle.properties",
    "gradle/**",
]
commit_preprocessors = [
    { pattern = '(?i)\s*\[(skip ci|ci skip|no ci|skip actions|actions skip)\]', replace = "" },
    { pattern = 'https?://\S+', replace = "" },
]
commit_parsers = [
    { message = '^Merge ', skip = true },
    { message = '^feat', group = "01_新增功能" },
    { message = '^fix', group = "02_问题修复" },
    { message = '^perf', group = "03_性能优化" },
    { message = '^refactor|^style', group = "04_改进" },
    { message = '^build|^chore\(deps', group = "05_组件更新" },
    { message = '^revert', group = "06_回退调整" },
    { message = '^docs?|^test|^ci|^chore', skip = true },
    { message = '.*', group = "07_其他更新" },
]
