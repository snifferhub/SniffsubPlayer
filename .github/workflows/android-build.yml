name: Build and Publish Android and iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the original group so pending Android-only runs cannot race this publisher.
  group: android-main-release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  PUBLIC_RELEASE_REPOSITORY: snifferhub/SniffSubPlayer-Releases
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version and commit range
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$PUBLIC_RELEASE_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          python3 .github/scripts/release_notes.py \
            --releases "$RUNNER_TEMP/releases.json" \
            --head "$GITHUB_SHA" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Reserve release build number
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > /dev/null

      - name: Generate release notes from commits
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: .github/cliff.toml
          args: ${{ steps.release.outputs.range }}
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md

      - name: Share release notes with publisher
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ steps.release.outputs.build }}
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 7
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        id: gradle
        uses: ./.github/actions/gradle-setup

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required signing or publishing configuration: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          ./gradlew :app:assembleRelease \
            -PreleaseBuildNumber="$RELEASE_BUILD_NUMBER"

      - name: Stop build daemons and remove signing material
        if: always() && steps.gradle.outcome == 'success'
        run: |
          rm -f "$RUNNER_TEMP/release-keystore.jks"
          ./gradlew --stop

      - name: Verify and collect signed APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          mkdir -p dist
          cp "$APK" dist/SniffSubPlayer-Android.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SniffSubPlayer-Android-${{ needs.prepare.outputs.build }}
          path: dist/SniffSubPlayer-Android.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  ios:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Gradle
        id: gradle
        uses: ./.github/actions/gradle-setup

      - name: Cache Kotlin Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-xcode26.6-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build iOS device release
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          xcodebuild build \
            -project iosApp/SniffSubPlayer.xcodeproj \
            -scheme SniffSubPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER"

      - name: Package unsigned IPA
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          APP="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/SniffSubPlayer.app"
          test -s "$APP/compose-resources/composeResources/com.sniffsub.composeapp.resources/files/sniffer.js"
          test ! -e "$APP/embedded.mobileprovision"
          test "$(xcrun lipo -archs "$APP/SniffSubPlayer")" = arm64
          xcrun vtool -show-build "$APP/SniffSubPlayer" | grep -Eq 'platform[[:space:]]+IOS$'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$RELEASE_BUILD_NUMBER"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP" "$RUNNER_TEMP/Payload/SniffSubPlayer.app"
          if codesign --display "$RUNNER_TEMP/Payload/SniffSubPlayer.app" >/dev/null 2>&1; then
            codesign --remove-signature "$RUNNER_TEMP/Payload/SniffSubPlayer.app"
          fi
          ditto -c -k --norsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/SniffSubPlayer-iOS-unsigned.ipa"
          unzip -tq "$RUNNER_TEMP/SniffSubPlayer-iOS-unsigned.ipa"

      - name: Stop build daemons
        if: always() && steps.gradle.outcome == 'success'
        run: ./gradlew --stop

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: SniffSubPlayer-iOS-${{ needs.prepare.outputs.build }}
          path: ${{ runner.temp }}/SniffSubPlayer-iOS-unsigned.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ needs.prepare.outputs.build }}'
          merge-multiple: true
          path: dist

      - name: Verify both packages and create shared checksums
        run: |
          test -s dist/SniffSubPlayer-Android.apk
          test -s dist/SniffSubPlayer-iOS-unsigned.ipa
          test -s dist/release-notes.md
          cd dist
          sha256sum SniffSubPlayer-Android.apk SniffSubPlayer-iOS-unsigned.ipa > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create repository-scoped release bot token
        id: release_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ANDROID_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANDROID_UPDATES_APP_PRIVATE_KEY }}
          owner: snifferhub
          repositories: SniffSubPlayer-Releases
          permission-contents: write

      - name: Publish Android and iOS together to release repository
        env:
          GH_TOKEN: ${{ steps.release_bot.outputs.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --json isDraft > "$RUNNER_TEMP/public-release.json" 2>/dev/null; then
            # A failed publish may leave a draft. Never overwrite a public release.
            test "$(jq -r .isDraft "$RUNNER_TEMP/public-release.json")" = true
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PUBLIC_RELEASE_REPOSITORY" --target main --draft \
              --title "SniffSubPlayer $APP_VERSION (build $RELEASE_BUILD_NUMBER)" \
              --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            dist/SniffSubPlayer-Android.apk dist/SniffSubPlayer-iOS-unsigned.ipa dist/SHA256SUMS.txt \
            --repo "$PUBLIC_RELEASE_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$PUBLIC_RELEASE_REPOSITORY" \
            --notes-file dist/release-notes.md --draft=false --latest
          printf 'Published Android APK and unsigned iOS IPA, build %s, to %s\n' \
            "$RELEASE_BUILD_NUMBER" "$PUBLIC_RELEASE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
