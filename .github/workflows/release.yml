name: Build and Release

on:
  push:
    branches:
      - Android
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug -PreleaseBuildNumber="$GITHUB_RUN_NUMBER" --no-daemon

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreleaseBuildNumber="$GITHUB_RUN_NUMBER" --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SniffSubPlayer-Android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/SniffSubPlayer-Android.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: SniffSubPlayer-Android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          RELEASE_TAG="android-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "SniffSubPlayer Android ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes \
            --latest

      - name: Sync signed APK to public update repository
        env:
          GH_TOKEN: ${{ secrets.ANDROID_UPDATES_PUBLISH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --depth 1 https://github.com/snifferhub/SniffSubPlayer-Android-Releases.git "$RUNNER_TEMP/public-updates"
          cd "$RUNNER_TEMP/public-updates"
          git checkout -b packages
          mkdir -p distribution
          cp "$GITHUB_WORKSPACE/dist/SniffSubPlayer-Android.apk" distribution/
          (cd distribution && sha256sum SniffSubPlayer-Android.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE'], 'app/build.gradle.kts').read_text()
          version = re.search(r'versionName = "([^"]+)"', source).group(1)
          tag = f"android-v{version}-build.{os.environ['GITHUB_RUN_NUMBER']}"
          Path('distribution/release.json').write_text(json.dumps({'tag': tag}))
          Path('distribution/release-notes.md').write_text(
              f'Signed Android release {tag}.\n\nUse Settings → Check for updates inside the app.\n')
          PY
          git config user.name 'SniffSubPlayer release bot'
          git config user.email 'noreply@snifferhub.dev'
          git add README.md .github/workflows/publish.yml distribution
          git commit -m "chore(release): distribute Android build $GITHUB_RUN_NUMBER"
          # This newly created repository's packages branch is a disposable APK snapshot.
          # Historical APKs remain available as immutable-version Release assets.
          git push --force origin HEAD:packages
