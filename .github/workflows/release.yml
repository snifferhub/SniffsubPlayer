name: Build and Release

on:
  push:
    branches:
      - flutter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        if: ${{ env.HAS_ANDROID_SIGNING_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            printf 'storeFile=release-keystore.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android packages
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number "$GITHUB_RUN_NUMBER"
          flutter build appbundle --release --target-platform android-arm,android-arm64 --build-number "$GITHUB_RUN_NUMBER"

      - name: Collect Android packages
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/SniffsubPlayer-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/SniffsubPlayer-Android-arm64-v8a.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/SniffsubPlayer-Android.aab

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: android-packages
          path: dist/*
          if-no-files-found: error

  ios:
    name: Build unsigned iOS package
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Package iOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/SniffsubPlayer-iOS-unsigned.zip

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: ios-package
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          BASE_VERSION="${APP_VERSION%%+*}"
          TAG="v${BASE_VERSION}-build.${GITHUB_RUN_NUMBER}"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum ./* > SHA256SUMS.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "SniffsubPlayer $RELEASE_TAG" \
            --generate-notes \
            --latest
