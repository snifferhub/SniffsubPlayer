name: Build and Release

on:
  push:
    branches:
      - Android
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug -PreleaseBuildNumber="$GITHUB_RUN_NUMBER" --no-daemon

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreleaseBuildNumber="$GITHUB_RUN_NUMBER" --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SniffSubPlayer-Android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/SniffSubPlayer-Android.apk
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: SniffSubPlayer-Android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          test -s release-notes/android.md
          RELEASE_TAG="android-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "SniffSubPlayer Android ${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file release-notes/android.md \
            --latest

      - name: Create repository-scoped release bot token
        id: android_updates_bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ANDROID_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANDROID_UPDATES_APP_PRIVATE_KEY }}
          owner: snifferhub
          repositories: SniffSubPlayer-Android-Releases
          permission-contents: write

      - name: Sync signed APK to public update repository
        env:
          GH_TOKEN: ${{ steps.android_updates_bot.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.android_updates_bot.outputs.app-slug }}[bot]
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          git clone --depth 1 https://github.com/snifferhub/SniffSubPlayer-Android-Releases.git "$RUNNER_TEMP/public-updates"
          cd "$RUNNER_TEMP/public-updates"
          git checkout -b packages
          mkdir -p distribution
          cp "$GITHUB_WORKSPACE/dist/SniffSubPlayer-Android.apk" distribution/
          cp "$GITHUB_WORKSPACE/release-notes/android.md" distribution/release-notes.md
          (cd distribution && sha256sum SniffSubPlayer-Android.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path(os.environ['GITHUB_WORKSPACE'], 'app/build.gradle.kts').read_text()
          version = re.search(r'versionName = "([^"]+)"', source).group(1)
          tag = f"android-v{version}-build.{os.environ['GITHUB_RUN_NUMBER']}"
          Path('distribution/release.json').write_text(json.dumps({'tag': tag}))
          PY
          RELEASE_BOT_ID="$(gh api "/users/$RELEASE_BOT_LOGIN" --jq .id)"
          export GIT_AUTHOR_NAME="$RELEASE_BOT_LOGIN"
          export GIT_COMMITTER_NAME="$RELEASE_BOT_LOGIN"
          export GIT_AUTHOR_EMAIL="$RELEASE_BOT_ID+$RELEASE_BOT_LOGIN@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add README.md .github/workflows/publish.yml distribution
          git commit -m "chore(release): distribute Android build $GITHUB_RUN_NUMBER"
          # This newly created repository's packages branch is a disposable APK snapshot.
          # Historical APKs remain available as immutable-version Release assets.
          git push --force origin HEAD:packages
